<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Placivo Background Gradient -->
    <linearGradient id="placivoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="placivoRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Rectangle Container -->
  <rect width="120" height="120" rx="30" fill="url(#placivoBgGrad)"/>

  <!-- Subtle Outer Accent Ring -->
  <rect x="6" y="6" width="108" height="108" rx="24" fill="none" stroke="url(#placivoRingGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Central Placivo Emblem (Graduation Cap + AI Tech Ring) -->
  <g transform="translate(24, 24)">
    <!-- Outer Tech Circle -->
    <circle cx="36" cy="36" r="32" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.25"/>
    
    <!-- Graduation Cap Top -->
    <path d="M 36 18 L 62 30 L 36 42 L 10 30 Z" fill="#FFFFFF"/>
    
    <!-- Cap Underneath Base -->
    <path d="M 21 37.5 V 47 C 21 52 51 52 51 47 V 37.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Tassel -->
    <path d="M 52 30 V 44" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
    <circle cx="52" cy="45" r="2" fill="#93C5FD"/>
  </g>
</svg>
